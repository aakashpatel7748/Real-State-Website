<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="700" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left Sidebar (Matching Plotline ERP dark teal theme) -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="220" height="700" rx="12" fill="#042026"/>
    <rect x="210" y="0" width="10" height="700" fill="#042026"/>

    <!-- Exact Plotline ERP Logo -->
    <g transform="translate(18, 22)">
      <rect width="28" height="28" rx="7" fill="#0f766e" />
      <path d="M6 8h7v5H6zM15 8h7v5h-7zM6 15h7v5H6z" fill="#ecfdf5" />
      <path d="M15 15h7v5h-7z" fill="#f59e0b" />
      <text x="36" y="20" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="700" font-size="18">Plotline</text>
    </g>

    <!-- Company Badge -->
    <g transform="translate(20, 70)" font-family="'Poppins', sans-serif">
      <text x="0" y="10" fill="#5eead4" font-size="9" font-weight="600" letter-spacing="1">COMPANY</text>
      <text x="0" y="26" fill="#ffffff" font-size="13" font-weight="600">Green Valley Realty</text>
    </g>

    <!-- Sidebar Menu Items -->
    <g transform="translate(12, 125)" font-family="'Poppins', sans-serif" font-size="13">
      <!-- Active Dashboard Pill -->
      <rect x="0" y="0" width="196" height="40" rx="8" fill="#08333c" stroke="#0d9488" stroke-width="1"/>
      <rect x="16" y="13" width="6" height="6" rx="1" fill="#14b8a6"/>
      <rect x="24" y="13" width="6" height="6" rx="1" fill="#14b8a6"/>
      <rect x="16" y="21" width="6" height="6" rx="1" fill="#14b8a6"/>
      <rect x="24" y="21" width="6" height="6" rx="1" fill="#14b8a6"/>
      <text x="40" y="25" fill="#ffffff" font-weight="600">Dashboard</text>

      <!-- Administration -->
      <g transform="translate(0, 52)">
        <text x="40" y="25" fill="#94a3b8" font-weight="500">Administration</text>
        <path d="M 175 20 L 180 25 L 185 20" fill="none" stroke="#64748b" stroke-width="1.5"/>
      </g>

      <!-- Master -->
      <g transform="translate(0, 96)">
        <text x="40" y="25" fill="#94a3b8" font-weight="500">Master</text>
        <path d="M 175 20 L 180 25 L 185 20" fill="none" stroke="#64748b" stroke-width="1.5"/>
      </g>

      <!-- Pre Sales -->
      <g transform="translate(0, 140)">
        <text x="40" y="25" fill="#94a3b8" font-weight="500">Pre Sales</text>
        <path d="M 175 20 L 180 25 L 185 20" fill="none" stroke="#64748b" stroke-width="1.5"/>
      </g>

      <!-- Post Sales -->
      <g transform="translate(0, 184)">
        <text x="40" y="25" fill="#94a3b8" font-weight="500">Post Sales</text>
        <path d="M 175 20 L 180 25 L 185 20" fill="none" stroke="#64748b" stroke-width="1.5"/>
      </g>

      <!-- Account -->
      <g transform="translate(0, 228)">
        <text x="40" y="25" fill="#94a3b8" font-weight="500">Account</text>
        <path d="M 175 20 L 180 25 L 185 20" fill="none" stroke="#64748b" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Bottom Collapse -->
    <text x="32" y="665" fill="#64748b" font-family="'Poppins', sans-serif" font-size="12">« Collapse</text>
  </g>

  <!-- Top Navbar -->
  <g transform="translate(220, 0)" font-family="'Poppins', sans-serif">
    <rect x="0" y="0" width="980" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Search Input -->
    <rect x="24" y="12" width="380" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="42" y="35" fill="#94a3b8" font-size="12">Search bookings, customers, plots...</text>
    <rect x="345" y="19" width="46" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="353" y="34" fill="#64748b" font-size="10" font-weight="600">Ctrl K</text>

    <!-- Project Selector Dropdown -->
    <rect x="520" y="12" width="220" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="536" y="35" fill="#0f172a" font-size="12" font-weight="500">Royal Green Valley Enclave</text>
    <path d="M 715 30 L 720 35 L 725 30" fill="none" stroke="#64748b" stroke-width="1.5"/>

    <!-- Bell Icon -->
    <circle cx="770" cy="30" r="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="776" cy="24" r="3" fill="#14b8a6"/>

    <!-- User Profile (Clean Director Account) -->
    <g transform="translate(805, 12)">
      <circle cx="18" cy="18" r="16" fill="#0f766e"/>
      <text x="18" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">RS</text>
      <text x="42" y="16" fill="#0f172a" font-size="12" font-weight="600">Rajesh Singhania</text>
      <text x="42" y="30" fill="#64748b" font-size="10">Director &amp; Owner</text>
    </g>
  </g>

  <!-- Main Dashboard Body Content -->
  <g transform="translate(244, 75)" font-family="'Poppins', sans-serif">
    <!-- Greeting Header -->
    <text x="0" y="32" fill="#0f172a" font-size="22" font-weight="700">Good afternoon, Rajesh</text>
    <text x="0" y="52" fill="#64748b" font-size="12">Royal Green Valley Enclave • as of 17 Nov 2026</text>

    <!-- ROW 1 (4 KPI Cards Matching Exact Product Screenshot) -->
    <g transform="translate(0, 72)">
      <!-- Card 1: Sales this month -->
      <rect x="0" y="0" width="220" height="106" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="18" y="28" fill="#64748b" font-size="12" font-weight="500">Sales this month</text>
      <circle cx="185" cy="26" r="14" fill="#ecfdf5"/>
      <path d="M 179 28 L 183 23 L 187 25 L 192 20" fill="none" stroke="#059669" stroke-width="2"/>
      <text x="18" y="68" fill="#0f172a" font-size="24" font-weight="700">₹1.95 Cr</text>
      <text x="18" y="90" fill="#64748b" font-size="11">5 bookings • FY ₹1.95 Cr</text>

      <!-- Card 2: Collections this month -->
      <rect x="236" y="0" width="220" height="106" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="254" y="28" fill="#64748b" font-size="12" font-weight="500">Collections this month</text>
      <circle cx="421" cy="26" r="14" fill="#ecfdf5"/>
      <text x="421" y="31" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">₹</text>
      <text x="254" y="68" fill="#0f172a" font-size="24" font-weight="700">₹24.39 L</text>
      <text x="254" y="90" fill="#64748b" font-size="11">FY to date ₹24.39 L</text>

      <!-- Card 3: Overdue dues -->
      <rect x="472" y="0" width="220" height="106" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="490" y="28" fill="#64748b" font-size="12" font-weight="500">Overdue dues</text>
      <circle cx="657" cy="26" r="14" fill="#fef2f2"/>
      <text x="657" y="30" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">▲</text>
      <text x="490" y="68" fill="#0f172a" font-size="24" font-weight="700">₹5.57 L</text>
      <text x="490" y="90" fill="#ef4444" font-size="11" font-weight="500">4 installments past due</text>

      <!-- Card 4: Available inventory -->
      <rect x="708" y="0" width="220" height="106" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="726" y="28" fill="#64748b" font-size="12" font-weight="500">Available inventory</text>
      <circle cx="893" cy="26" r="14" fill="#fef3c7"/>
      <rect x="888" y="21" width="10" height="10" rx="1" fill="#d97706"/>
      <text x="726" y="68" fill="#0f172a" font-size="24" font-weight="700">3 / 10 plots</text>
      <text x="726" y="90" fill="#64748b" font-size="11">Worth ₹1.04 Cr</text>
    </g>

    <!-- ROW 2 (Outstanding & Expenses) -->
    <g transform="translate(0, 194)">
      <!-- Card 5: Outstanding receivable -->
      <rect x="0" y="0" width="340" height="106" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="18" y="28" fill="#64748b" font-size="12" font-weight="500">Outstanding receivable</text>
      <circle cx="305" cy="26" r="14" fill="#f0fdfa"/>
      <text x="305" y="31" fill="#0d9488" font-size="13" font-weight="bold" text-anchor="middle">💼</text>
      <text x="18" y="68" fill="#0f172a" font-size="24" font-weight="700">₹1.71 Cr</text>
      <text x="18" y="90" fill="#64748b" font-size="11">Across active bookings</text>

      <!-- Card 6: Expenses this month -->
      <rect x="356" y="0" width="340" height="106" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="374" y="28" fill="#64748b" font-size="12" font-weight="500">Expenses this month</text>
      <circle cx="661" cy="26" r="14" fill="#f0fdfa"/>
      <text x="661" y="31" fill="#0d9488" font-size="13" font-weight="bold" text-anchor="middle">₹</text>
      <text x="374" y="68" fill="#0f172a" font-size="24" font-weight="700">₹5.74 L</text>
      <text x="374" y="90" fill="#64748b" font-size="11">Posted to expense accounts</text>
    </g>

    <!-- ROW 3 (Operations: Leads, Land, Works) -->
    <g transform="translate(0, 316)">
      <!-- Card 7: Leads -->
      <rect x="0" y="0" width="295" height="98" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="18" y="26" fill="#64748b" font-size="12" font-weight="500">Leads</text>
      <circle cx="260" cy="24" r="13" fill="#fef2f2"/>
      <circle cx="260" cy="24" r="6" fill="#ef4444"/>
      <text x="18" y="58" fill="#0f172a" font-size="22" font-weight="700">4 open</text>
      <text x="18" y="80" fill="#64748b" font-size="11">4 follow-ups due • 0 won this month</text>

      <!-- Card 8: Land acquisition -->
      <rect x="311" y="0" width="295" height="98" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="329" y="26" fill="#64748b" font-size="12" font-weight="500">Land acquisition</text>
      <circle cx="571" cy="24" r="13" fill="#f0fdfa"/>
      <text x="571" y="29" fill="#0d9488" font-size="12" font-weight="bold" text-anchor="middle">📍</text>
      <text x="329" y="58" fill="#0f172a" font-size="22" font-weight="700">₹50 L</text>
      <text x="329" y="80" fill="#64748b" font-size="11">paid of ₹1 Cr agreed • 1 parcels</text>

      <!-- Card 9: Development works -->
      <rect x="622" y="0" width="306" height="98" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="640" y="26" fill="#64748b" font-size="12" font-weight="500">Development works</text>
      <circle cx="893" cy="24" r="13" fill="#fef3c7"/>
      <text x="893" y="29" fill="#d97706" font-size="12" font-weight="bold" text-anchor="middle">👷</text>
      <text x="640" y="58" fill="#0f172a" font-size="22" font-weight="700">₹2.5 L</text>
      <text x="640" y="80" fill="#64748b" font-size="11">billed of ₹6.5 L committed • 1 open orders</text>
    </g>
  </g>
</svg>
