    <text x="20" y="32" fill="#fff" font-size="15" font-weight="bold">Collections &amp; Revenue Velocity</text>
    <text x="20" y="50" fill="#94a3b8" font-size="11">Monthly collection vs milestone targets (₹ in Lakhs)</text>
    
    <!-- Chart Path -->
    <path d="M 40 230 Q 120 180, 200 190 T 320 140 T 420 110 T 510 80" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <path d="M 40 230 Q 120 180, 200 190 T 320 140 T 420 110 T 510 80 L 510 240 L 40 240 Z" fill="url(#chartGrad)"/>
    <!-- Horizontal Grid Lines -->
    <line x1="40" y1="80" x2="510" y2="80" stroke="#334155" stroke-dasharray="4"/>
    <line x1="40" y1="130" x2="510" y2="130" stroke="#334155" stroke-dasharray="4"/>
    <line x1="40" y1="180" x2="510" y2="180" stroke="#334155" stroke-dasharray="4"/>
