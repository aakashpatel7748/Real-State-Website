<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="0" y="0" width="1200" height="760" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#1e293b"/>
  <rect x="0" y="30" width="1200" height="14" fill="#1e293b"/>
  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#ef4444" />
  <circle cx="44" cy="22" r="6" fill="#f59e0b" />
  <circle cx="64" cy="22" r="6" fill="#10b981" />
  <!-- URL Address Bar -->
  <rect x="180" y="8" width="840" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="210" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">https://erp.plotline.in/dashboard • Royal Greens Township (180 Acres Plotted Phase 1)</text>

  <!-- Sidebar -->
  <rect x="0" y="44" width="220" height="716" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Sidebar Brand -->
  <rect x="20" y="64" width="36" height="36" rx="8" fill="url(#blueGrad)"/>
  <text x="31" y="88" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="20">P</text>
  <text x="68" y="82" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="16">Plotline ERP</text>
  <text x="68" y="96" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">COLONY SUITE</text>

  <!-- Sidebar Nav Items -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13">
    <!-- Active Nav Item -->
    <rect x="12" y="125" width="196" height="38" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="32" cy="144" r="5" fill="#3b82f6"/>
    <text x="48" y="148" fill="#fff" font-weight="600">Overview Dashboard</text>

    <text x="48" y="188" fill="#94a3b8">Interactive Plot Map</text>
    <text x="48" y="228" fill="#94a3b8">Pre-Sales Leads (CRM)</text>
    <text x="48" y="268" fill="#94a3b8">Unit Bookings &amp; BBA</text>
    <text x="48" y="308" fill="#94a3b8">Milestone Demand Letters</text>
    <text x="48" y="348" fill="#94a3b8">PDC Cheque Vault</text>
    <text x="48" y="388" fill="#94a3b8">Customer Ledgers</text>
    <text x="48" y="428" fill="#94a3b8">Khasra/Khata Land</text>
    <text x="48" y="468" fill="#94a3b8">Site Work Orders</text>
    <text x="48" y="508" fill="#94a3b8">Double-Entry Accounts</text>
    <text x="48" y="548" fill="#94a3b8">GST Vouchers &amp; Tax</text>
  </g>

  <!-- Main Content Area -->
  <!-- Top Stats Bar -->
  <g transform="translate(240, 64)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Stat Card 1 -->
    <rect x="0" y="0" width="220" height="96" rx="12" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)"/>
    <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600">TOTAL INVENTORY</text>
    <text x="16" y="58" fill="#ffffff" font-size="24" font-weight="bold">148 Units</text>
    <text x="16" y="80" fill="#10b981" font-size="11">● 92 Booked  ● 38 Available</text>

    <!-- Stat Card 2 -->
    <rect x="236" y="0" width="220" height="96" rx="12" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)"/>
    <text x="252" y="26" fill="#94a3b8" font-size="11" font-weight="600">CONFIRMED SALES</text>
    <text x="252" y="58" fill="#ffffff" font-size="24" font-weight="bold">₹ 28.45 Cr</text>
    <text x="252" y="80" fill="#3b82f6" font-size="11">Collected: ₹ 19.80 Cr (70%)</text>

    <!-- Stat Card 3 -->
    <rect x="472" y="0" width="220" height="96" rx="12" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)"/>
    <text x="488" y="26" fill="#94a3b8" font-size="11" font-weight="600">PDC CHEQUES IN VAULT</text>
    <text x="488" y="58" fill="#f59e0b" font-size="24" font-weight="bold">₹ 68.50 Lakh</text>
    <text x="488" y="80" fill="#f59e0b" font-size="11">24 Cheques maturing in 30d</text>

    <!-- Stat Card 4 -->
    <rect x="708" y="0" width="220" height="96" rx="12" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)"/>
    <text x="724" y="26" fill="#94a3b8" font-size="11" font-weight="600">OVERDUE RECOVERY</text>
    <text x="724" y="58" fill="#ef4444" font-size="24" font-weight="bold">₹ 34.20 Lakh</text>
    <text x="724" y="80" fill="#ef4444" font-size="11">Auto Demand Letters Ready</text>
  </g>

  <!-- Sales Chart & Colony Map Split -->
  <g transform="translate(240, 180)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Chart Box (Left) -->
