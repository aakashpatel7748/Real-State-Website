    <text x="130" y="254" fill="#64748b" font-size="10">Mar</text>
    <text x="210" y="254" fill="#64748b" font-size="10">May</text>
    <text x="290" y="254" fill="#64748b" font-size="10">Jul</text>
    <text x="370" y="254" fill="#64748b" font-size="10">Sep</text>
    <text x="450" y="254" fill="#64748b" font-size="10">Nov</text>

    <!-- Colony Layout Mini Visual (Right) -->
