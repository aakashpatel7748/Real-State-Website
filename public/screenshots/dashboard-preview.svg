    <text x="590" y="32" fill="#fff" font-size="15" font-weight="bold">Colony Layout Status (Sector A)</text>
    <text x="590" y="50" fill="#94a3b8" font-size="11">Real-time unit lock &amp; color-coded inventory</text>

    <!-- Mini Plots Grid -->
    <g transform="translate(590, 70)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="60" height="42" rx="4" fill="#ef4444" fill-opacity="0.8" stroke="#f87171"/><text x="14" y="25" fill="#fff" font-size="11" font-weight="bold">A-101</text>
      <rect x="68" y="0" width="60" height="42" rx="4" fill="#ef4444" fill-opacity="0.8" stroke="#f87171"/><text x="82" y="25" fill="#fff" font-size="11" font-weight="bold">A-102</text>
      <rect x="136" y="0" width="60" height="42" rx="4" fill="#10b981" fill-opacity="0.8" stroke="#34d399"/><text x="150" y="25" fill="#fff" font-size="11" font-weight="bold">A-103</text>
      <rect x="204" y="0" width="60" height="42" rx="4" fill="#f59e0b" fill-opacity="0.8" stroke="#fbbf24"/><text x="218" y="25" fill="#fff" font-size="11" font-weight="bold">A-104</text>
      <rect x="272" y="0" width="60" height="42" rx="4" fill="#10b981" fill-opacity="0.8" stroke="#34d399"/><text x="286" y="25" fill="#fff" font-size="11" font-weight="bold">A-105</text>
      
      <!-- Central Road -->
      <rect x="0" y="50" width="332" height="18" fill="#0f172a" rx="2"/>
      <text x="100" y="63" fill="#64748b" font-size="9" letter-spacing="2">60 FT BOULEVARD</text>

      <!-- Row 2 -->
      <rect x="0" y="76" width="60" height="42" rx="4" fill="#64748b" fill-opacity="0.8" stroke="#94a3b8"/><text x="14" y="101" fill="#fff" font-size="11" font-weight="bold">A-106</text>
      <rect x="68" y="76" width="60" height="42" rx="4" fill="#ef4444" fill-opacity="0.8" stroke="#f87171"/><text x="82" y="101" fill="#fff" font-size="11" font-weight="bold">A-107</text>
      <rect x="136" y="76" width="60" height="42" rx="4" fill="#10b981" fill-opacity="0.8" stroke="#34d399"/><text x="150" y="101" fill="#fff" font-size="11" font-weight="bold">A-108</text>
      <rect x="204" y="76" width="60" height="42" rx="4" fill="#ef4444" fill-opacity="0.8" stroke="#f87171"/><text x="218" y="101" fill="#fff" font-size="11" font-weight="bold">A-109</text>
      <rect x="272" y="76" width="60" height="42" rx="4" fill="#10b981" fill-opacity="0.8" stroke="#34d399"/><text x="286" y="101" fill="#fff" font-size="11" font-weight="bold">A-110</text>
      
      <!-- Legend -->
      <circle cx="10" cy="140" r="5" fill="#10b981"/>
      <text x="20" y="144" fill="#cbd5e1" font-size="10">Available (38)</text>
      <circle cx="100" cy="140" r="5" fill="#f59e0b"/>
      <text x="110" y="144" fill="#cbd5e1" font-size="10">Reserved (18)</text>
      <circle cx="190" cy="140" r="5" fill="#ef4444"/>
      <text x="200" y="144" fill="#cbd5e1" font-size="10">Booked (92)</text>
      <circle cx="270" cy="140" r="5" fill="#64748b"/>
      <text x="280" y="144" fill="#cbd5e1" font-size="10">Registered</text>
    </g>
  </g>

  <!-- Recent Bookings Table -->
  <g transform="translate(240, 480)" font-family="system-ui, -apple-system, sans-serif">
    <rect x="0" y="0" width="930" height="230" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="32" fill="#fff" font-size="15" font-weight="bold">Recent Confirmed Bookings &amp; Payment Plans</text>
    
    <!-- Table Header -->
    <rect x="20" y="50" width="890" height="32" fill="#0f172a" rx="6"/>
    <text x="35" y="71" fill="#94a3b8" font-size="11" font-weight="600">BOOKING ID</text>
    <text x="150" y="71" fill="#94a3b8" font-size="11" font-weight="600">CUSTOMER NAME</text>
    <text x="320" y="71" fill="#94a3b8" font-size="11" font-weight="600">UNIT / PLOT</text>
    <text x="460" y="71" fill="#94a3b8" font-size="11" font-weight="600">TOTAL CONSIDERATION</text>
    <text x="640" y="71" fill="#94a3b8" font-size="11" font-weight="600">PDC CLEARANCE</text>
    <text x="790" y="71" fill="#94a3b8" font-size="11" font-weight="600">STATUS</text>

    <!-- Row 1 -->
    <text x="35" y="106" fill="#3b82f6" font-size="12" font-weight="bold">#BK-2026-089</text>
    <text x="150" y="106" fill="#ffffff" font-size="12">Rameshwar Sharma</text>
    <text x="320" y="106" fill="#cbd5e1" font-size="12">Plot A-101 (1500 sqft)</text>
    <text x="460" y="106" fill="#ffffff" font-size="12" font-weight="bold">₹ 42,00,000</text>
    <text x="640" y="106" fill="#10b981" font-size="11">● Cleared (HDFC #4910)</text>
    <rect x="790" y="92" width="110" height="22" rx="4" fill="#065f46"/><text x="800" y="107" fill="#6ee7b7" font-size="10" font-weight="bold">AGREEMENT SIGNED</text>

    <!-- Row 2 -->
    <text x="35" y="146" fill="#3b82f6" font-size="12" font-weight="bold">#BK-2026-090</text>
    <text x="150" y="146" fill="#ffffff" font-size="12">Dr. Alok Verma</text>
    <text x="320" y="146" fill="#cbd5e1" font-size="12">Plot A-106 (Corner, 2100 sqft)</text>
    <text x="460" y="146" fill="#ffffff" font-size="12" font-weight="bold">₹ 68,25,000</text>
    <text x="640" y="146" fill="#3b82f6" font-size="11">● Loan Disbursed (SBI)</text>
    <rect x="790" y="132" width="110" height="22" rx="4" fill="#1e3a8a"/><text x="806" y="147" fill="#93c5fd" font-size="10" font-weight="bold">REGISTRY DONE</text>

    <!-- Row 3 -->
    <text x="35" y="186" fill="#3b82f6" font-size="12" font-weight="bold">#BK-2026-091</text>
    <text x="150" y="186" fill="#ffffff" font-size="12">Kavita &amp; Sunil Saxena</text>
    <text x="320" y="186" fill="#cbd5e1" font-size="12">Plot B-202 (1500 sqft)</text>
    <text x="460" y="186" fill="#ffffff" font-size="12" font-weight="bold">₹ 39,75,000</text>
    <text x="640" y="186" fill="#f59e0b" font-size="11">● Cheque in Vault (Due 24 Nov)</text>
    <rect x="790" y="172" width="110" height="22" rx="4" fill="#78350f"/><text x="814" y="187" fill="#fcd34d" font-size="10" font-weight="bold">TOKEN ACTIVE</text>
  </g>
</svg>
