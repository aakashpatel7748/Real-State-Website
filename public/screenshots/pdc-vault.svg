    <text x="28" y="34" fill="#94a3b8" font-size="11" font-weight="bold">CHEQUE NO</text>
    <text x="140" y="34" fill="#94a3b8" font-size="11" font-weight="bold">CUSTOMER &amp; BOOKING</text>
    <text x="340" y="34" fill="#94a3b8" font-size="11" font-weight="bold">ISSUING BANK</text>
