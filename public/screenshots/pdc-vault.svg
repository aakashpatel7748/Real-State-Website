      <text x="128" y="40" fill="#94a3b8" font-size="10">Booking: #BK-076 (Plot B-205)</text>
      <text x="328" y="30" fill="#cbd5e1" font-size="12">Punjab National Bank (PNB)</text>
      <text x="478" y="30" fill="#ffffff" font-size="14" font-weight="bold">₹ 6,40,000</text>
      <text x="618" y="30" fill="#94a3b8" font-size="12">05 Dec 2026</text>
      <rect x="758" y="14" width="140" height="26" rx="4" fill="#1e3a8a"/>
      <text x="828" y="31" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">SAFE IN VAULT</text>
