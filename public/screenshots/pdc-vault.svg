    <text x="0" y="32" fill="#94a3b8" font-size="11">Customer installment cheques are safeguarded in vault; official receipts and ledger credits are issued only on bank clearance.</text>
  </g>

  <!-- Summary Filters & Tabs -->
  <g transform="translate(24, 80)" font-family="system-ui, sans-serif">
    <rect x="0" y="0" width="220" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
