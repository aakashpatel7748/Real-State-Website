    <text x="765" y="34" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">+ Deposit Cheque</text>

    <rect x="830" y="10" width="120" height="38" rx="8" fill="#059669"/>
    <text x="890" y="34" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">✓ Clear Selected</text>
