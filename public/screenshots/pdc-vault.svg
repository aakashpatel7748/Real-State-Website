      <rect x="0" y="0" width="928" height="52" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="30" fill="#60a5fa" font-size="13" font-weight="bold">#771920</text>
      <text x="128" y="24" fill="#ffffff" font-size="12" font-weight="bold">Kavita Chawla</text>
      <text x="128" y="40" fill="#94a3b8" font-size="10">Booking: #BK-082 (Plot A-102)</text>
      <text x="328" y="30" fill="#cbd5e1" font-size="12">ICICI Bank (TT Nagar)</text>
      <text x="478" y="30" fill="#ffffff" font-size="14" font-weight="bold">₹ 3,85,000</text>
      <text x="618" y="30" fill="#10b981" font-size="12">Cleared Yesterday</text>
      <rect x="758" y="14" width="140" height="26" rx="4" fill="#047857"/>
      <text x="828" y="31" fill="#d1fae5" font-size="10" font-weight="bold" text-anchor="middle">RECEIPT ISSUED (#4192)</text>
