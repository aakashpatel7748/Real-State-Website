      <text x="128" y="24" fill="#ffffff" font-size="12" font-weight="bold">Anil &amp; Sunita Mehta</text>
      <text x="128" y="40" fill="#94a3b8" font-size="10">Booking: #BK-089 (Plot A-101)</text>
