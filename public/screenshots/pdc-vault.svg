    <text x="14" y="50" fill="#ffffff" font-size="20" font-weight="bold">24 Cheques (₹ 68.5 L)</text>

    <rect x="235" y="0" width="220" height="64" rx="8" fill="#1e293b" stroke="#f59e0b"/>
    <text x="249" y="24" fill="#fde68a" font-size="10" font-weight="bold">MATURING IN NEXT 7 DAYS</text>
    <text x="249" y="50" fill="#f59e0b" font-size="20" font-weight="bold">6 Cheques (₹ 19.2 L)</text>

    <rect x="470" y="0" width="220" height="64" rx="8" fill="#1e293b" stroke="#10b981"/>
    <text x="484" y="24" fill="#a7f3d0" font-size="10" font-weight="bold">CLEARED THIS MONTH</text>
    <text x="484" y="50" fill="#10b981" font-size="20" font-weight="bold">18 Cheques (₹ 54.0 L)</text>

