<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <!-- Window Container -->
  <rect x="0" y="0" width="1000" height="580" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1000" height="60" rx="14" fill="#1e293b"/>
  <rect x="0" y="44" width="1000" height="16" fill="#1e293b"/>

  <g transform="translate(24, 20)" font-family="system-ui, sans-serif">
