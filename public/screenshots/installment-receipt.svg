<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <filter id="pageShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Document Sheet -->
  <rect x="20" y="20" width="760" height="960" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#pageShadow)"/>

  <!-- Official Letterhead Header -->
  <g transform="translate(60, 60)" font-family="system-ui, sans-serif">
    <!-- Builder Logo & Name -->
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#1e3a8a"/>
    <text x="14" y="32" fill="#ffffff" font-weight="bold" font-size="24">G</text>
    
    <text x="60" y="24" fill="#0f172a" font-size="20" font-weight="bold">GREEN VALLEY TOWNSHIP DEVELOPERS PVT LTD</text>
    <text x="60" y="42" fill="#64748b" font-size="11">RERA Registration No: PRM/KA/RERA/1251/2026 • CIN: U70102MP2026PTC049102</text>
    <text x="60" y="56" fill="#64748b" font-size="11">Corporate Office: MP Nagar Zone-II, Bhopal, Madhya Pradesh 462011</text>

    <line x1="0" y1="75" x2="680" y2="75" stroke="#0f172a" stroke-width="2"/>
    <line x1="0" y1="78" x2="680" y2="78" stroke="#3b82f6" stroke-width="1"/>

    <!-- Document Title -->
    <rect x="180" y="95" width="320" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="340" y="116" fill="#1e3a8a" font-size="13" font-weight="bold" text-anchor="middle">PAYMENT DEMAND &amp; MILESTONE NOTICE</text>

    <!-- Ref & Date -->
    <text x="0" y="150" fill="#64748b" font-size="11">Notice Ref: <tspan fill="#0f172a" font-weight="bold">GVT/DEMAND/2026/089</tspan></text>
    <text x="680" y="150" fill="#64748b" font-size="11" text-anchor="end">Date of Issue: <tspan fill="#0f172a" font-weight="bold">17 November 2026</tspan></text>

    <!-- Customer & Unit Box -->
    <rect x="0" y="165" width="680" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="16" y="188" fill="#64748b" font-size="11">ALLOTTEE / BUYER DETAILS:</text>
    <text x="16" y="208" fill="#0f172a" font-size="14" font-weight="bold">Mr. Rajesh Kumar Verma &amp; Smt. Suman Verma</text>
    <text x="16" y="226" fill="#475569" font-size="11">Address: E-7/84, Arera Colony, Bhopal, MP | Mobile: +91 98260 12345</text>
    <text x="16" y="242" fill="#475569" font-size="11">Co-Applicant: Mrs. Suman Verma | Financer: State Bank of India (Home Loan A/c #38910)</text>

    <text x="440" y="188" fill="#64748b" font-size="11">BOOKING SPECIFICATIONS:</text>
    <text x="440" y="208" fill="#1e3a8a" font-size="14" font-weight="bold">Plot No: A-104 (Sector A)</text>
    <text x="440" y="226" fill="#475569" font-size="11">Project: Royal Palms Enclave (Phase 1)</text>
    <text x="440" y="242" fill="#475569" font-size="11">Area: 1,800 Sq.Ft | Total Value: ₹ 55,80,000</text>

    <!-- Milestone Schedule Table -->
    <text x="0" y="280" fill="#0f172a" font-size="13" font-weight="bold">SCHEDULE OF PAYMENT &amp; CONSTRUCTION MILESTONES:</text>

    <!-- Table Header -->
    <rect x="0" y="295" width="680" height="30" fill="#1e293b"/>
    <text x="12" y="315" fill="#ffffff" font-size="11" font-weight="bold">STAGE #</text>
    <text x="80" y="315" fill="#ffffff" font-size="11" font-weight="bold">MILESTONE DESCRIPTION</text>
    <text x="320" y="315" fill="#ffffff" font-size="11" font-weight="bold">% DUE</text>
    <text x="410" y="315" fill="#ffffff" font-size="11" font-weight="bold">AMOUNT (₹)</text>
    <text x="540" y="315" fill="#ffffff" font-size="11" font-weight="bold">STATUS</text>

    <!-- Row 1 -->
    <rect x="0" y="325" width="680" height="36" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="12" y="348" fill="#475569" font-size="11">01</text>
    <text x="80" y="348" fill="#0f172a" font-size="11" font-weight="600">At the time of Booking (Token Bayana)</text>
    <text x="320" y="348" fill="#475569" font-size="11">10%</text>
    <text x="410" y="348" fill="#0f172a" font-size="11" font-weight="bold">₹ 5,58,000</text>
    <text x="540" y="348" fill="#059669" font-size="10" font-weight="bold">PAID (Rcpt #4012)</text>

    <!-- Row 2 -->
    <rect x="0" y="361" width="680" height="36" fill="#f8fafc" stroke="#f1f5f9"/>
    <text x="12" y="384" fill="#475569" font-size="11">02</text>
    <text x="80" y="384" fill="#0f172a" font-size="11" font-weight="600">On Execution of Builder Buyer Agreement</text>
    <text x="320" y="384" fill="#475569" font-size="11">15%</text>
    <text x="410" y="384" fill="#0f172a" font-size="11" font-weight="bold">₹ 8,37,000</text>
    <text x="540" y="384" fill="#059669" font-size="10" font-weight="bold">PAID (Rcpt #4190)</text>

    <!-- Row 3 (DUE NOW) -->
    <rect x="0" y="397" width="680" height="42" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="12" y="423" fill="#b91c1c" font-size="11" font-weight="bold">03</text>
    <text x="80" y="423" fill="#b91c1c" font-size="12" font-weight="bold">On Completion of Plinth &amp; Boundary Wall</text>
    <text x="320" y="423" fill="#b91c1c" font-size="11" font-weight="bold">20%</text>
    <text x="410" y="423" fill="#b91c1c" font-size="14" font-weight="bold">₹ 11,16,000</text>
    <rect x="535" y="408" width="130" height="20" rx="4" fill="#ef4444"/>
    <text x="600" y="422" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">PAYABLE IMMEDIATELY</text>

    <!-- Row 4 -->
    <rect x="0" y="439" width="680" height="36" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="12" y="462" fill="#64748b" font-size="11">04</text>
    <text x="80" y="462" fill="#64748b" font-size="11">On Completion of Asphalt Road &amp; Sewerage</text>
    <text x="320" y="462" fill="#64748b" font-size="11">25%</text>
    <text x="410" y="462" fill="#64748b" font-size="11">₹ 13,95,000</text>
    <text x="540" y="462" fill="#94a3b8" font-size="10">Upcoming Stage</text>

    <!-- Row 5 -->
    <rect x="0" y="475" width="680" height="36" fill="#f8fafc" stroke="#f1f5f9"/>
    <text x="12" y="498" fill="#64748b" font-size="11">05</text>
    <text x="80" y="498" fill="#64748b" font-size="11">On Offer of Possession &amp; Registry Handover</text>
    <text x="320" y="498" fill="#64748b" font-size="11">30%</text>
    <text x="410" y="498" fill="#64748b" font-size="11">₹ 16,74,000</text>
    <text x="540" y="498" fill="#94a3b8" font-size="10">Upcoming Stage</text>

    <!-- Summary Box -->
    <g transform="translate(360, 530)">
      <rect x="0" y="0" width="320" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="16" y="25" fill="#475569" font-size="11">Total Unit Price:</text>
      <text x="300" y="25" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="end">₹ 55,80,000</text>

      <text x="16" y="50" fill="#475569" font-size="11">Total Received So Far (Rcpt 01+02):</text>
      <text x="300" y="50" fill="#059669" font-size="11" font-weight="bold" text-anchor="end">₹ 13,95,000</text>

      <line x1="16" y1="65" x2="300" y2="65" stroke="#cbd5e1"/>

      <text x="16" y="90" fill="#b91c1c" font-size="13" font-weight="bold">NET AMOUNT PAYABLE NOW:</text>
      <text x="300" y="90" fill="#b91c1c" font-size="16" font-weight="bold" text-anchor="end">₹ 11,16,000</text>
    </g>

    <!-- Bank RTGS & QR Code Box -->
    <g transform="translate(0, 530)">
      <rect x="0" y="0" width="340" height="110" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="14" y="22" fill="#1e3a8a" font-size="11" font-weight="bold">RERA DESIGNATED ESCROW ACCOUNT DETAILS:</text>
      <text x="14" y="40" fill="#1e293b" font-size="10">Bank: <tspan font-weight="bold">HDFC Bank Ltd (Commercial Branch, Bhopal)</tspan></text>
      <text x="14" y="56" fill="#1e293b" font-size="10">Account Name: <tspan font-weight="bold">Green Valley Township RERA Escrow</tspan></text>
      <text x="14" y="72" fill="#1e293b" font-size="10">A/c No: <tspan font-weight="bold">50200084920194</tspan> | IFSC: <tspan font-weight="bold">HDFC0001254</tspan></text>
      <text x="14" y="92" fill="#2563eb" font-size="9">*All payments must be made strictly via Cheque, RTGS, or NEFT</text>
    </g>

    <!-- Footer Seals & Signatures -->
    <g transform="translate(0, 680)">
      <text x="0" y="20" fill="#64748b" font-size="10">This demand notice is generated electronically by Plotline Real Estate ERP and is compliant with RERA Act Section 11.</text>
      
      <!-- Company Seal -->
      <circle cx="100" cy="90" r="40" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4"/>
      <text x="100" y="85" fill="#dc2626" font-size="9" font-weight="bold" text-anchor="middle">GREEN VALLEY</text>
      <text x="100" y="98" fill="#dc2626" font-size="8" font-weight="bold" text-anchor="middle">AUTHORIZED SEAL</text>

      <!-- Signature -->
      <path d="M 520 80 Q 550 50, 580 85 T 620 75" fill="none" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="500" y1="100" x2="680" y2="100" stroke="#94a3b8"/>
      <text x="590" y="115" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">For Green Valley Township Developers</text>
      <text x="590" y="128" fill="#64748b" font-size="10" text-anchor="middle">Authorized Signatory (Finance &amp; Legal)</text>
    </g>
  </g>
</svg>
