<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="580" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Page Header -->
  <g transform="translate(32, 28)" font-family="'Poppins', sans-serif">
    <text x="0" y="24" fill="#0f172a" font-size="22" font-weight="700">Sales Dashboard</text>
    <text x="0" y="44" fill="#64748b" font-size="12">Royal Green Valley Enclave • enquiries, conversions and bookings</text>

    <!-- Date Filter Controls (Right) -->
    <g transform="translate(680, 0)">
      <text x="0" y="10" fill="#64748b" font-size="11">From</text>
      <rect x="0" y="16" width="120" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="38" fill="#0f172a" font-size="11">01-10-2026 📅</text>

      <text x="135" y="10" fill="#64748b" font-size="11">To</text>
      <rect x="135" y="16" width="120" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="147" y="38" fill="#0f172a" font-size="11">17-11-2026 📅</text>
    </g>

    <!-- 4 Top Stat Cards (Exact match to user's screenshot 2) -->
    <g transform="translate(0, 68)">
      <!-- Card 1: New enquiries -->
      <rect x="0" y="0" width="220" height="96" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="18" y="26" fill="#64748b" font-size="12" font-weight="500">New enquiries</text>
      <circle cx="185" cy="24" r="14" fill="#f0fdfa"/>
      <circle cx="185" cy="24" r="6" fill="#0d9488"/>
      <text x="18" y="62" fill="#0f172a" font-size="24" font-weight="700">4</text>
      <text x="18" y="82" fill="#64748b" font-size="11">0 won • 0.0% conversion</text>

      <!-- Card 2: Site visits -->
      <rect x="236" y="0" width="220" height="96" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="254" y="26" fill="#64748b" font-size="12" font-weight="500">Site visits</text>
      <circle cx="421" cy="24" r="14" fill="#f0fdfa"/>
      <text x="421" y="29" fill="#0d9488" font-size="12" font-weight="bold" text-anchor="middle">👣</text>
      <text x="254" y="62" fill="#0f172a" font-size="24" font-weight="700">3</text>

      <!-- Card 3: Bookings -->
      <rect x="472" y="0" width="220" height="96" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="490" y="26" fill="#64748b" font-size="12" font-weight="500">Bookings</text>
      <circle cx="657" cy="24" r="14" fill="#ecfdf5"/>
      <text x="657" y="29" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">₹</text>
      <text x="490" y="62" fill="#0f172a" font-size="24" font-weight="700">5</text>
      <text x="490" y="82" fill="#64748b" font-size="11">₹1.95 Cr • 0 cancelled</text>

      <!-- Card 4: Follow-ups due -->
      <rect x="708" y="0" width="228" height="96" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="726" y="26" fill="#64748b" font-size="12" font-weight="500">Follow-ups due</text>
      <circle cx="901" cy="24" r="14" fill="#fef2f2"/>
      <text x="901" y="29" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle">📅</text>
      <text x="726" y="62" fill="#0f172a" font-size="24" font-weight="700">4</text>
      <text x="726" y="82" fill="#ef4444" font-size="11" font-weight="500">4 overdue • 0 today</text>
    </g>

    <!-- Split Visuals (Weekly Chart & Open Pipeline) -->
    <g transform="translate(0, 185)">
      <!-- Left Box: Weekly enquiries vs bookings chart -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="620" height="310" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
        <text x="24" y="32" fill="#0f172a" font-size="14" font-weight="600">📈 Weekly enquiries vs bookings</text>

        <!-- Chart Grid Lines -->
        <g transform="translate(45, 60)">
          <line x1="0" y1="40" x2="530" y2="40" stroke="#f1f5f9" stroke-dasharray="4"/>
          <text x="-15" y="44" fill="#94a3b8" font-size="10" text-anchor="end">8</text>

          <line x1="0" y1="90" x2="530" y2="90" stroke="#f1f5f9" stroke-dasharray="4"/>
          <text x="-15" y="94" fill="#94a3b8" font-size="10" text-anchor="end">6</text>

          <line x1="0" y1="140" x2="530" y2="140" stroke="#f1f5f9" stroke-dasharray="4"/>
          <text x="-15" y="144" fill="#94a3b8" font-size="10" text-anchor="end">4</text>

          <line x1="0" y1="190" x2="530" y2="190" stroke="#f1f5f9" stroke-dasharray="4"/>
          <text x="-15" y="194" fill="#94a3b8" font-size="10" text-anchor="end">2</text>

          <line x1="0" y1="240" x2="530" y2="240" stroke="#cbd5e1"/>
          <text x="-15" y="244" fill="#94a3b8" font-size="10" text-anchor="end">0</text>

          <!-- X axis label -->
          <text x="265" y="260" fill="#64748b" font-size="10" text-anchor="middle">W45</text>

          <!-- Dots for W45 matching user's chart -->
          <circle cx="265" cy="115" r="4.5" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
          <circle cx="265" cy="140" r="4.5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
        </g>
      </g>

      <!-- Right Box: Open pipeline bars (Exact match to screenshot 2) -->
      <g transform="translate(640, 0)">
        <rect x="0" y="0" width="296" height="310" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
        <text x="24" y="32" fill="#0f172a" font-size="14" font-weight="600">Open pipeline</text>

        <g transform="translate(24, 55)">
          <!-- New -->
          <text x="0" y="16" fill="#0f172a" font-size="12" font-weight="500">New</text>
          <text x="248" y="16" fill="#0f172a" font-size="12" font-weight="700" text-anchor="end">1</text>
          <rect x="0" y="24" width="248" height="8" rx="4" fill="#004d40"/>

          <!-- Contacted -->
          <text x="0" y="60" fill="#0f172a" font-size="12" font-weight="500">Contacted</text>
          <text x="248" y="60" fill="#0f172a" font-size="12" font-weight="700" text-anchor="end">1</text>
          <rect x="0" y="68" width="248" height="8" rx="4" fill="#004d40"/>

          <!-- Site Visit Done -->
          <text x="0" y="104" fill="#0f172a" font-size="12" font-weight="500">Site Visit Done</text>
          <text x="248" y="104" fill="#0f172a" font-size="12" font-weight="700" text-anchor="end">1</text>
          <rect x="0" y="112" width="248" height="8" rx="4" fill="#004d40"/>

          <!-- Negotiation -->
          <text x="0" y="148" fill="#0f172a" font-size="12" font-weight="500">Negotiation</text>
          <text x="248" y="148" fill="#0f172a" font-size="12" font-weight="700" text-anchor="end">1</text>
          <rect x="0" y="156" width="248" height="8" rx="4" fill="#004d40"/>

          <line x1="0" y1="185" x2="248" y2="185" stroke="#f1f5f9"/>

          <!-- Quotations stat -->
          <g transform="translate(0, 205)">
            <text x="0" y="16" fill="#475569" font-size="12">📄 5 quotations (₹1.95 Cr) • 0 converted</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
