<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="1200" height="700" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left Sidebar (Matching Plotline ERP dark teal theme) -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="220" height="700" rx="12" fill="#042026"/>
    <rect x="210" y="0" width="10" height="700" fill="#042026"/>

    <!-- Exact Plotline ERP Logo -->
    <g transform="translate(18, 22)">
      <rect width="28" height="28" rx="7" fill="#0f766e" />
      <path d="M6 8h7v5H6zM15 8h7v5h-7zM6 15h7v5H6z" fill="#ecfdf5" />
      <path d="M15 15h7v5h-7z" fill="#f59e0b" />
      <text x="36" y="20" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="700" font-size="18">Plotline</text>
    </g>

    <!-- Company Badge -->
    <g transform="translate(20, 70)" font-family="'Poppins', sans-serif">
      <text x="0" y="10" fill="#5eead4" font-size="9" font-weight="600" letter-spacing="1">COMPANY</text>
      <text x="0" y="26" fill="#ffffff" font-size="13" font-weight="600">Green Valley Realty</text>
    </g>

    <!-- Sidebar Menu Items -->
    <g transform="translate(12, 120)" font-family="'Poppins', sans-serif" font-size="13">
      <!-- Dashboard -->
      <g transform="translate(0, 0)">
        <rect x="16" y="13" width="6" height="6" rx="1" fill="#94a3b8"/>
        <rect x="24" y="13" width="6" height="6" rx="1" fill="#94a3b8"/>
        <rect x="16" y="21" width="6" height="6" rx="1" fill="#94a3b8"/>
        <rect x="24" y="21" width="6" height="6" rx="1" fill="#94a3b8"/>
        <text x="40" y="25" fill="#94a3b8" font-weight="500">Dashboard</text>
      </g>

      <!-- Administration (Expanded) -->
      <g transform="translate(0, 48)">
        <text x="16" y="25" fill="#5eead4" font-size="13">⚙</text>
        <text x="40" y="25" fill="#ffffff" font-weight="600">Administration</text>
        <path d="M 175 22 L 180 18 L 185 22" fill="none" stroke="#5eead4" stroke-width="1.5"/>

        <!-- Sub-items under Administration -->
        <g transform="translate(0, 36)" font-size="12">
          <!-- Active Plot Map Pill -->
          <rect x="8" y="0" width="180" height="34" rx="6" fill="#08333c" stroke="#0d9488" stroke-width="1"/>
          <circle cx="24" cy="17" r="3" fill="#2dd4bf"/>
          <text x="36" y="21" fill="#ffffff" font-weight="600">Units &amp; Plot Map</text>

          <text x="36" y="55" fill="#94a3b8" font-weight="500">Company Profile</text>
          <text x="36" y="85" fill="#94a3b8" font-weight="500">Projects &amp; Phases</text>
          <text x="36" y="115" fill="#94a3b8" font-weight="500">Bank &amp; Cash Accounts</text>
          <text x="36" y="145" fill="#94a3b8" font-weight="500">Rate &amp; Price Indexes</text>
        </g>
      </g>

      <!-- Master Menu -->
      <g transform="translate(0, 245)">
        <text x="16" y="25" fill="#94a3b8" font-size="13">👥</text>
        <text x="40" y="25" fill="#94a3b8" font-weight="500">Master</text>
        <path d="M 175 20 L 180 24 L 185 20" fill="none" stroke="#64748b" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- Top Header Navigation Bar (x: 220 to 1200) -->
  <g transform="translate(220, 0)">
    <rect x="0" y="0" width="980" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Search Input -->
    <g transform="translate(24, 12)">
      <rect x="0" y="0" width="380" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="20" cy="18" r="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="24.5" y1="22.5" x2="29" y2="27" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <text x="38" y="23" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="12">Search bookings, customers, plots...</text>
      <rect x="325" y="8" width="44" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="333" y="22" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="10" font-weight="600">Ctrl K</text>
    </g>

    <!-- Project Selector Dropdown -->
    <g transform="translate(560, 12)">
      <rect x="0" y="0" width="220" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="23" fill="#0f172a" font-family="'Poppins', sans-serif" font-size="12" font-weight="600">Green Valley Enclave</text>
      <path d="M 195 16 L 200 21 L 205 16" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </g>

    <!-- Notification Bell -->
    <g transform="translate(805, 20)">
      <circle cx="10" cy="10" r="14" fill="#f8fafc"/>
      <path d="M6 14h8m-7 0v-4a3 3 0 016 0v4m-5 3a1.5 1.5 0 003 0" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </g>

    <!-- User Profile: Admin -->
    <g transform="translate(845, 12)" font-family="'Poppins', sans-serif">
      <circle cx="18" cy="18" r="16" fill="#0f766e"/>
      <text x="18" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">A</text>
      <text x="42" y="18" fill="#0f172a" font-size="12" font-weight="600">Admin</text>
      <text x="42" y="30" fill="#64748b" font-size="10">Director</text>
    </g>
  </g>

  <!-- Sub-Header (Breadcrumb & Action Bar) -->
  <g transform="translate(244, 76)" font-family="'Poppins', sans-serif">
    <text x="0" y="12" fill="#64748b" font-size="12">
      Projects <tspan fill="#cbd5e1">›</tspan> Green Valley Enclave <tspan fill="#cbd5e1">›</tspan> <tspan fill="#0d9488" font-weight="600">Map</tspan>
    </text>
    <text x="0" y="44" fill="#0f172a" font-size="22" font-weight="700">Plot map</text>
    <text x="0" y="66" fill="#64748b" font-size="12">Green Valley Enclave • 10 plots • updates automatically</text>

    <!-- Action Buttons -->
    <g transform="translate(680, 24)">
      <!-- View Button -->
      <rect x="0" y="0" width="85" height="36" rx="8" fill="#042026"/>
      <text x="42" y="23" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">👁 View</text>

      <!-- Edit Layout Button -->
      <rect x="96" y="0" width="115" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="153" y="23" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">✎ Edit layout</text>
    </g>
  </g>

  <!-- Main Canvas & Legend Layout (Matching Real App) -->
  <g transform="translate(244, 160)">
    <!-- Main Map Viewport Card -->
    <rect x="0" y="0" width="670" height="510" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>

    <!-- Canvas Zoom Controls on Left -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="34" height="106" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="17" y="24" fill="#334155" font-size="18" font-weight="bold" text-anchor="middle">+</text>
      <line x1="8" y1="36" x2="26" y2="36" stroke="#f1f5f9"/>
      <text x="17" y="58" fill="#334155" font-size="18" font-weight="bold" text-anchor="middle">−</text>
      <line x1="8" y1="70" x2="26" y2="70" stroke="#f1f5f9"/>
      <text x="17" y="94" fill="#334155" font-size="14" font-weight="bold" text-anchor="middle">⛶</text>
    </g>

    <!-- PLOTS ON CANVAS (Exact Authentic Coordinates from User Screenshot) -->
    <g transform="translate(30, 20)">
      
      <!-- Plot TBA-TEST-A-103 (Large Green Plot: Available) -->
      <rect x="70" y="90" width="290" height="230" fill="#22c55e" opacity="0.82" rx="4"/>
      <text x="180" y="200" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Plot A-103</text>

      <!-- Plot TBA-TEST-B-205 (Top Green Plot: Available) -->
      <rect x="340" y="30" width="170" height="160" fill="#22c55e" opacity="0.75" rx="4"/>
      <text x="425" y="110" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Plot B-205</text>

      <!-- Plot TBA-TEST-C-302 (Gray Plot: Blocked) -->
      <rect x="290" y="160" width="110" height="120" fill="#64748b" opacity="0.85" rx="4" stroke="#ffffff" stroke-width="1.5"/>
      <text x="345" y="225" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Plot C-302</text>

      <!-- Plot TBA-TEST-B-204 (Right Green Plot: Available) -->
      <rect x="435" y="110" width="95" height="190" fill="#22c55e" opacity="0.75" rx="4"/>
      <text x="482" y="205" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Plot B-204</text>

      <!-- Plot TBA-TEST-A-101 (Front Blue Plot: Booked) -->
      <rect x="350" y="200" width="120" height="110" fill="#3b82f6" opacity="0.95" rx="4" stroke="#ffffff" stroke-width="1.5"/>
      <text x="410" y="260" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Plot A-101</text>

      <!-- Tooltip Card Over Plot A-103 (Exact Replica of Software Popover) -->
      <g transform="translate(108, 142)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="140" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="14" y="22" fill="#0f172a" font-family="'Poppins', sans-serif" font-size="12" font-weight="700">Plot A-103</text>
        <text x="14" y="42" fill="#16a34a" font-family="'Poppins', sans-serif" font-size="11" font-weight="600">Available • 2400 sq ft</text>
        <text x="14" y="60" fill="#0f172a" font-family="'Poppins', sans-serif" font-size="12" font-weight="700">₹45,60,000</text>
      </g>
    </g>

    <!-- RIGHT LEGEND CARD (Exact Authentic 1:1 Layout from User's Screenshot) -->
    <g transform="translate(690, 0)">
      <rect x="0" y="0" width="240" height="510" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>

      <g transform="translate(20, 24)" font-family="'Poppins', sans-serif">
        <text x="0" y="16" fill="#0f172a" font-size="15" font-weight="700">Legend</text>

        <!-- Status Item: Available -->
        <g transform="translate(0, 48)">
          <circle cx="8" cy="8" r="6" fill="#22c55e"/>
          <text x="24" y="12" fill="#334155" font-size="13" font-weight="500">Available</text>
          <text x="190" y="12" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">3</text>
        </g>

        <!-- Status Item: Reserved -->
        <g transform="translate(0, 84)">
          <circle cx="8" cy="8" r="6" fill="#f59e0b"/>
          <text x="24" y="12" fill="#334155" font-size="13" font-weight="500">Reserved</text>
          <text x="190" y="12" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">0</text>
        </g>

        <!-- Status Item: Booked -->
        <g transform="translate(0, 120)">
          <circle cx="8" cy="8" r="6" fill="#3b82f6"/>
          <text x="24" y="12" fill="#334155" font-size="13" font-weight="500">Booked</text>
          <text x="190" y="12" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">5</text>
        </g>

        <!-- Status Item: Sold -->
        <g transform="translate(0, 156)">
          <circle cx="8" cy="8" r="6" fill="#8b5cf6"/>
          <text x="24" y="12" fill="#334155" font-size="13" font-weight="500">Sold</text>
          <text x="190" y="12" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">1</text>
        </g>

        <!-- Status Item: Blocked -->
        <g transform="translate(0, 192)">
          <circle cx="8" cy="8" r="6" fill="#64748b"/>
          <text x="24" y="12" fill="#334155" font-size="13" font-weight="500">Blocked</text>
          <text x="190" y="12" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">1</text>
        </g>

        <!-- Divider line -->
        <line x1="0" y1="230" x2="195" y2="230" stroke="#f1f5f9" stroke-width="1.5"/>

        <!-- Instructional description -->
        <text x="0" y="255" fill="#64748b" font-size="11" font-weight="normal">Click a status to highlight it.</text>
        <text x="0" y="275" fill="#64748b" font-size="11" font-weight="normal">Click a plot for details.</text>
        <text x="0" y="295" fill="#64748b" font-size="11" font-weight="normal">Scroll to zoom, drag to pan.</text>

        <!-- Live Sync Pill -->
        <g transform="translate(0, 335)">
          <rect x="0" y="0" width="195" height="52" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
          <circle cx="16" cy="18" r="4" fill="#10b981"/>
          <text x="28" y="22" fill="#065f46" font-size="11" font-weight="700">Atomic Lock Active</text>
          <text x="14" y="40" fill="#047857" font-size="10">0% Double-Booking Risk</text>
        </g>
      </g>
    </g>
  </g>
</svg>
